# Secret scanning in CI (#108). The default rule set covers the common key and
# token shapes; the allowlist below keeps a full-history scan from reporting the
# two values that are already burned.
[extend]
useDefault = true

[allowlist]
description = """
The JWT signing secret and the RAWG API key were committed as defaults in
backend/src/main/resources/application.yml while the project lived on HdM
GitLab, and the RAWG key travelled into a committed project dump as well.
#4 removed the defaults. The JWT secret was replaced. The old RAWG key belongs
to an account the team cannot reach and stays valid until its owner resets it.
#108 records the decision to leave the history as it is instead of rewriting it.
The commits below carry those burned values and are not findings.
"""
commits = [
  "f1b8dd3c7f6f87cd3674e352eed69a36ae3ce153", # add: GameSearch #36 — RAWG key as a default
  "111baa41f84983029ade05dfc19f4cc8a098a129", # add: book search #34 — RAWG key as a default
  "6a0156b664034946c1fd91c1cb6ae8e60ae79fdf", # refactor: Finalize cleanup and security improvements #57 — JWT secret
  "4bd4ea9c902fe153c97134e8603977f959fc2990", # refactor: better variable names #57 — RAWG key twice in backend_dump.txt
  "5769339d0c5d6aaca7a7f9b33edc40c8759e49d0", # refactor: JavaDoc to English — rewrote the line around the secret
  "62aa32655c2859952588cc6f2df4167c2387cd41", # align main with develop
  "6b874367884641f41f2d6fc9bc7ce33966fe74e2", # Revert "Merge branch 'feature/frontend' into 'main'"
  "22c226b1265ccd195e4cafad03a5e3bd7e768b03", # fix: drop the secret defaults from application.yml #4
]

# The example files hold variable names without values, and the test
# configuration holds deliberate dummies.
paths = [
  '''\.env\.example$''',
  '''backend/src/test/resources/application\.yml$''',
]

# A secret variable with a default value after the colon, the way the RAWG key
# leaked. The README forbids that default in step 2 of "Adding a new API key".
# The default may not start with + - = or ?, because those are the shell
# parameter expansion operators rather than a value: backend/mvnw carries
# ${MVNW_PASSWORD:+has-password}, which is not a secret.
[[rules]]
id = "env-placeholder-default"
description = "A secret variable with a default value after the colon"
regex = '''\$\{[A-Z0-9_]*(?:KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*:([^}\s+=?-][^}\s]*)\}'''
secretGroup = 1
