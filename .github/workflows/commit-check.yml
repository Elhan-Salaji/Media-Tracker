name: Commit Check

# Checks the commit messages of every pull request and of every push to the
# integration branches against the format in CONTRIBUTING.md.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-check:
    name: Commit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The runner image ships Python 3, and the script needs nothing beyond the
      # standard library.
      - name: Check commit messages
        run: python3 .github/scripts/check_commits.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
