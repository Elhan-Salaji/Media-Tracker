name: CI

# Push pipelines only run on the integration branches. Every other branch is
# covered by its pull request, so a branch with an open PR is not built twice.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # LINT
  # ==========================================

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  backend-validate:
    name: Backend Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate POM
        working-directory: backend
        run: ./mvnw validate

  # ==========================================
  # TEST
  # ==========================================

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    needs: backend-validate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Flapdoodle downloads the mongod binary for the embedded database once
      # and keeps it in ~/.embedmongo.
      - name: Cache embedded MongoDB
        uses: actions/cache@v6
        with:
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-7.0.0

      # The integration tests start an embedded MongoDB (Flapdoodle),
      # so the job needs no database service.
      - name: Run tests
        working-directory: backend
        run: ./mvnw test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ==========================================
  # BUILD
  # ==========================================

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package JAR
        working-directory: backend
        run: ./mvnw package -DskipTests

      - uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ==========================================
  # PACKAGE (Docker)
  # ==========================================
  # Building the images is expensive and only interesting for a change that is
  # about to reach main, so these jobs stay off feature-branch pushes.

  docker-backend:
    name: Docker Image Backend
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t media-tracker-backend:latest backend/

  docker-frontend:
    name: Docker Image Frontend
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build -t media-tracker-frontend:latest frontend/
