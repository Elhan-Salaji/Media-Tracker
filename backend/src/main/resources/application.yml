spring:
  config:
    # A local run reads the secrets from backend/.env, see backend/.env.example.
    import: optional:file:.env[.properties]
  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://localhost:27017
      database: mediatracker
  application:
    name: media-tracker-backend

server:
  port: 8080

# ---- App Config (Security) ----
app:
  jwt:
    # No default. The backend refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET}
    access-token-expiration-in-seconds: 900 # 15 minutes
    refresh-token-expiration-in-seconds: 1209600 # 14 days

# ---- API Feature Toggles ----
search:
  anime:
    enabled: true
  music:
    enabled: true
  game:
    enabled: true
  book:
    enabled: true
  manga:
    enabled: true
  movie:
    enabled: true
  series:
    enabled: true

# ---- Outgoing Requests ----
web-client:
  # Sent with every request to the search APIs. Open Library asks for the application name and a
  # contact e-mail, so set HTTP_USER_AGENT in backend/.env when you run the backend. Maven fills in
  # the version.
  user-agent: "${HTTP_USER_AGENT:MediaTracker/@project.version@ (+https://github.com/Elhan-Salaji/Media-Tracker)}"

# ---- External API Configs ----
jikan:
  base-url: https://api.jikan.moe/v4

itunes:
  base-url: https://itunes.apple.com

rawg:
  base-url: https://rawg.io/api
  # No default. While game search is enabled, the backend refuses to start without RAWG_API_KEY.
  api-key: ${RAWG_API_KEY}

openlibrary:
  base-url: https://openlibrary.org

imdb:
  base-url: https://api.imdbapi.dev